name = "Agent usage"
description = "How much of each AI coding tool's allowance is used, from Omarchy's records"
# A program that keeps running: it prints a new card whenever the records change.
exec = ["./agent-usage.py"]
# Omarchy's collectors read each tool's credentials and history, go online for the limits, and
# write their records under ~/.local/state and ~/.cache, so they run as you.
needs = ["everything"]
